##### PREFIX #####
# Use Ctrl+a instead of Ctrl+b
set -g prefix C-a
unbind C-b
bind C-a send-prefix

##### GENERAL #####
set -g mouse on                 # Enable mouse support
set -g history-limit 10000      # Bigger scrollback
set -g base-index 1             # Windows start at 1
setw -g pane-base-index 1       # Panes start at 1
set -g repeat-time 500          # Faster repeat for commands

##### SPLITS #####
bind | split-window -h          # Vertical split with |
bind - split-window -v          # Horizontal split with -
unbind '"'
unbind %

##### VIM-STYLE NAVIGATION #####
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

##### RESIZE PANES #####
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

##### WINDOW MANAGEMENT #####
bind c new-window
bind , command-prompt "rename-window %%"
bind & kill-window
bind x kill-pane

##### STATUS BAR #####
set -g status-bg black
set -g status-fg white
set -g status-interval 5

set -g status-left-length 40
set -g status-left "#[fg=green]#S #[fg=white]|"

set -g status-right-length 80
set -g status-right "#[fg=cyan]%Y-%m-%d #[fg=yellow]%H:%M #[fg=green]#(whoami)"
